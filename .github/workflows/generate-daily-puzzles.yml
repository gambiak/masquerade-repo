name: Generate Daily Masquerade Puzzles 

on:
  schedule:
    # GitHub schedules use UTC.
    #
    # 09:23 UTC every day.
    # Avoid the top of the hour because
    # GitHub warns scheduled workflows
    # can be delayed at high-load times.
    - cron: "23 9 * * *"

  workflow_dispatch:
    inputs:
      fill_days:
        description: "Fill tomorrow through how many days ahead?"
        required: true
        default: "14"
        type: choice
        options:
          - "1"
          - "3"
          - "7"
          - "14"

concurrency:
  group: masquerade-puzzle-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    timeout-minutes: 90

    permissions:
      contents: read

    steps:
      - name: Generate future Masquerade puzzles
        shell: bash

        env:
          MASQUERADE_APP_URL: ${{ secrets.MASQUERADE_APP_URL }}

          PUZZLE_CRON_SECRET: ${{ secrets.PUZZLE_CRON_SECRET }}

          EVENT_NAME: ${{ github.event_name }}

          FILL_DAYS: ${{ inputs.fill_days }}

        run: |
          set -euo pipefail

          if [ -z "${MASQUERADE_APP_URL:-}" ]; then
            echo "MASQUERADE_APP_URL secret is missing."
            exit 1
          fi

          if [ -z "${PUZZLE_CRON_SECRET:-}" ]; then
            echo "PUZZLE_CRON_SECRET secret is missing."
            exit 1
          fi

          BASE_URL="${MASQUERADE_APP_URL%/}"

          if [ "$EVENT_NAME" = "schedule" ]; then
            #
            # Normal daily run:
            #
            # Generate exactly the day that is
            # 14 days in the future.
            #
            # Because yesterday's run generated
            # day +13 relative to today, this
            # maintains a rolling 14-day buffer.
            #
            START_OFFSET=14
            END_OFFSET=14
          else
            #
            # Manual bootstrap:
            #
            # Generate tomorrow through N days.
            #
            START_OFFSET=1
            END_OFFSET="${FILL_DAYS:-14}"
          fi

          for OFFSET in $(seq "$START_OFFSET" "$END_OFFSET"); do

            TARGET_DATE=$(date -u -d "+${OFFSET} day" +%F)

            echo ""
            echo "========================================"
            echo "Masquerade ${TARGET_DATE}"
            echo "========================================"

            for DIFFICULTY in clever devious fiendish; do

              echo ""
              echo "Generating ${DIFFICULTY}..."

              SUCCESS=false

              for ATTEMPT in 1 2; do

                echo "Attempt ${ATTEMPT}"

                HTTP_CODE=$(
                  curl \
                    --silent \
                    --show-error \
                    --output response.json \
                    --write-out "%{http_code}" \
                    --max-time 600 \
                    --request POST \
                    "${BASE_URL}/api/admin/puzzles/generate" \
                    --header "Authorization: Bearer ${PUZZLE_CRON_SECRET}" \
                    --header "Content-Type: application/json" \
                    --data "{\"targetDate\":\"${TARGET_DATE}\",\"difficulty\":\"${DIFFICULTY}\"}" \
                  || true
                )

                cat response.json || true
                echo ""

                if [ "$HTTP_CODE" = "200" ]; then
                  SUCCESS=true
                  break
                fi

                echo "HTTP ${HTTP_CODE}. Retrying..."
                sleep 10

              done

              if [ "$SUCCESS" != "true" ]; then
                echo ""
                echo "Generation failed for:"
                echo "${TARGET_DATE} / ${DIFFICULTY}"

                exit 1
              fi

            done

          done