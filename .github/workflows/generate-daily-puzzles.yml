name: Generate Daily Masquerade Puzzles

on:
  schedule:
    # 09:23 UTC every day. Scheduled runs maintain
    # a rolling 14-day future buffer.
    - cron: "23 9 * * *"

  workflow_dispatch:
    inputs:
      fill_days:
        description: "Fill tomorrow through how many days ahead?"
        required: true
        default: "14"
        type: choice
        options:
          - "1"
          - "3"
          - "7"
          - "14"

concurrency:
  group: masquerade-puzzle-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    permissions:
      contents: read

    steps:
      - name: Generate future Masquerade puzzles
        shell: bash

        env:
          MASQUERADE_APP_URL: ${{ secrets.MASQUERADE_APP_URL }}
          PUZZLE_CRON_SECRET: ${{ secrets.PUZZLE_CRON_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
          FILL_DAYS: ${{ inputs.fill_days }}

        run: |
          set -euo pipefail

          if [ -z "${MASQUERADE_APP_URL:-}" ]; then
            echo "MASQUERADE_APP_URL secret is missing."
            exit 1
          fi

          if [ -z "${PUZZLE_CRON_SECRET:-}" ]; then
            echo "PUZZLE_CRON_SECRET secret is missing."
            exit 1
          fi

          BASE_URL="${MASQUERADE_APP_URL%/}"

          if [ "$EVENT_NAME" = "schedule" ]; then
            START_OFFSET=14
            END_OFFSET=14
          else
            START_OFFSET=1
            END_OFFSET="${FILL_DAYS:-14}"
          fi

          call_stage() {
            local target_date="$1"
            local difficulty="$2"
            local stage="$3"
            local round="${4:-}"
            local payload

            if [ -n "$round" ]; then
              payload="{\"targetDate\":\"${target_date}\",\"difficulty\":\"${difficulty}\",\"stage\":\"${stage}\",\"round\":${round}}"
            else
              payload="{\"targetDate\":\"${target_date}\",\"difficulty\":\"${difficulty}\",\"stage\":\"${stage}\"}"
            fi

            echo ""
            echo "----------------------------------------"
            echo "${target_date} / ${difficulty} / ${stage}${round:+ / round ${round}}"
            echo "----------------------------------------"

            # Each expensive application request performs at most one OpenAI call.
            # Do not blindly retry timeout responses because the server may still
            # have completed the model call and persisted its result.
            HTTP_CODE=$(
              curl \
                --silent \
                --show-error \
                --output response.json \
                --write-out "%{http_code}" \
                --max-time 230 \
                --request POST \
                "${BASE_URL}/api/admin/puzzles/generate" \
                --header "Authorization: Bearer ${PUZZLE_CRON_SECRET}" \
                --header "Content-Type: application/json" \
                --data "$payload" \
              || true
            )

            cat response.json || true
            echo ""
            echo "HTTP ${HTTP_CODE}"

            if [ "$HTTP_CODE" != "200" ]; then
              echo "Stage failed."
              exit 1
            fi
          }

          for OFFSET in $(seq "$START_OFFSET" "$END_OFFSET"); do
            TARGET_DATE=$(date -u -d "+${OFFSET} day" +%F)

            echo ""
            echo "========================================"
            echo "Masquerade ${TARGET_DATE}"
            echo "========================================"

            for DIFFICULTY in clever devious fiendish; do
              # Round 1 starts a fresh batch.
              call_stage "$TARGET_DATE" "$DIFFICULTY" "generate" "1"
              call_stage "$TARGET_DATE" "$DIFFICULTY" "review"

              # Rounds 2-4 are adaptive. The application feeds accumulated
              # reviewer rejection reasons back into the generator. If five
              # diverse publishable puzzles already exist, generateStage skips
              # the OpenAI call and the paired review becomes a cheap no-op.
              call_stage "$TARGET_DATE" "$DIFFICULTY" "generate" "2"
              call_stage "$TARGET_DATE" "$DIFFICULTY" "review"

              call_stage "$TARGET_DATE" "$DIFFICULTY" "generate" "3"
              call_stage "$TARGET_DATE" "$DIFFICULTY" "review"

              call_stage "$TARGET_DATE" "$DIFFICULTY" "generate" "4"
              call_stage "$TARGET_DATE" "$DIFFICULTY" "review"

              # Publishing is database-only and should be fast.
              call_stage "$TARGET_DATE" "$DIFFICULTY" "publish"
            done
          done
